<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DOIntelligence · Your Money. Your Markets. Your Intelligence.</title>
<style>
:root{--bg:#f3f4f2;--surf:#fff;--fg:#151a21;--mut:#697386;--line:#dde0e4;--acc:#2f48d8;--up:#12804a;--dn:#c2372b;--c0:#2f48d8;--c1:#2a9d8f;--c2:#e0a526;--c3:#7b6bd6;--c4:#8a97a8;--c5:#c9784a}
:root[data-theme=dark]{--bg:#0b0f17;--surf:#121927;--fg:#e8ecf4;--mut:#8a94a8;--line:#1f2938;--acc:#7c9cff;--up:#3ddc97;--dn:#ff6b6b;--c0:#7c9cff;color-scheme:dark}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0b0f17;--surf:#121927;--fg:#e8ecf4;--mut:#8a94a8;--line:#1f2938;--acc:#7c9cff;--up:#3ddc97;--dn:#ff6b6b;--c0:#7c9cff;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 "IBM Plex Sans","Segoe UI",system-ui,sans-serif;font-variant-numeric:tabular-nums}
.app{display:grid;grid-template-columns:210px minmax(0,1fr) auto;min-height:100vh}
nav{padding:28px 0;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh}
.brand{padding:0 24px 24px;font-weight:600;letter-spacing:-.01em;font-size:1.05rem}
nav a{padding:8px 24px;color:var(--mut);text-decoration:none;border-left:2px solid transparent}
nav a:hover{color:var(--fg)}
nav a.on{color:var(--fg);font-weight:600;border-left-color:var(--acc)}
nav small{margin-top:auto;padding:0 24px;color:var(--mut);font-size:.8rem}
main{padding:28px clamp(16px,3vw,40px) 64px;width:100%;min-width:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;color:var(--mut);font-size:.85rem;margin-bottom:28px;flex-wrap:wrap}
button{font:inherit;padding:.45rem .85rem;border:1px solid var(--line);background:var(--surf);color:var(--fg);border-radius:6px;cursor:pointer}
button:hover{border-color:var(--mut)}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
h1{font-size:clamp(2rem,5vw,3.1rem);font-weight:600;letter-spacing:-.025em;margin:0;line-height:1.1}
h1.pg{font-size:1.5rem;margin-bottom:20px;letter-spacing:-.015em}
h2{font-size:.95rem;font-weight:600;margin:0 0 12px}
section{margin-bottom:44px}
.lab{margin:0 0 6px;color:var(--mut);font-size:.88rem}
.up{color:var(--up)}.dn{color:var(--dn)}
.hero{display:grid;gap:22px}
.ln{width:100%;height:200px;display:block}
.ln .st{fill:none;stroke:var(--acc);stroke-width:1.6}
.ln .ar{fill:var(--acc);opacity:.08}
.sp{width:92px;height:26px;display:block}
.sp .st{fill:none;stroke-width:1.5}
.sp.up .st{stroke:var(--up)}.sp.dn .st{stroke:var(--dn)}
#rd{color:var(--mut);font-size:.85rem;min-height:1.4em}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:24px;margin-bottom:24px}
.alo{display:flex;gap:24px;align-items:center}
.dono{width:150px;flex:none;transform:rotate(0)}
.leg{list-style:none;margin:0;padding:0;display:grid;gap:6px;flex:1;font-size:.9rem}
.leg li{display:flex;justify-content:space-between;gap:8px}
.leg i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:8px}
.pb{display:grid;gap:10px}
.pb div{display:grid;grid-template-columns:64px 1fr 64px;gap:10px;align-items:center;font-size:.88rem}
.tr{height:8px;position:relative;background:color-mix(in srgb,var(--line) 60%,transparent);border-radius:2px}
.tr b{position:absolute;top:0;height:100%;border-radius:2px}
.tr.c::before{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--mut)}
.sc{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th{font-weight:500;color:var(--mut);text-align:right;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left;padding-left:0}
td small{display:block;color:var(--mut);font-size:.8rem}
td.l,th.l{text-align:left}
.seg{display:inline-flex;margin-bottom:22px}
.seg button{border-radius:0}.seg button:first-child{border-radius:6px 0 0 6px}.seg button:last-child{border-radius:0 6px 6px 0;border-left:0}
.seg button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:36px;margin-bottom:36px}
fieldset{border:0;padding:0;margin:0;display:grid;gap:10px;align-content:start}
legend{font-weight:600;font-size:.95rem;margin-bottom:10px;padding:0}
label{display:grid;gap:4px;color:var(--mut);font-size:.84rem}
input,select{font:inherit;width:100%;padding:.45rem .6rem;border:1px solid var(--line);border-radius:6px;background:var(--surf);color:var(--fg)}
dl{margin:0;display:grid;gap:0}
dl div{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
dt{color:var(--mut)}dd{margin:0;font-weight:600;text-align:right}
.note{color:var(--mut);font-size:.85rem;margin:10px 0 0}
.hu{background:color-mix(in srgb,var(--up) 14%,transparent)}.hd{background:color-mix(in srgb,var(--dn) 14%,transparent)}
td.hu,td.hd{text-align:center}
.bar{width:100%;height:160px;display:block;margin-top:14px}
.bar .ax{stroke:var(--line)}.bar .rp{fill:var(--up)}.bar .rn{fill:var(--dn)}
.alr{display:flex;gap:10px;align-items:end;flex-wrap:wrap;margin-bottom:26px}.alr label{min-width:130px}
.chip{display:inline-block;padding:1px 8px;border-radius:99px;font-size:.8rem;border:1px solid var(--line)}
.chip.t{border-color:var(--up);color:var(--up)}
.nl{list-style:none;margin:0;padding:0}.nl li{display:grid;grid-template-columns:70px 1fr 56px;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:.9rem}
.pn{background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:20px}
.ac{display:block;max-width:100%;touch-action:pan-y}
.ac .gr{stroke:var(--line);stroke-dasharray:2 4}.ac .tx{fill:var(--mut);font-size:11px}.ac .cx{stroke:var(--mut);stroke-dasharray:3 3}
.rng{display:flex;gap:4px}.rng button{padding:.25rem .7rem;font-size:.82rem;border-radius:99px}.rng button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.hd2{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.kp{display:flex;gap:28px;flex-wrap:wrap}.kp div{display:grid;gap:2px}.kp span{color:var(--mut);font-size:.82rem}.kp b{font-size:1rem}
.dw{width:160px;flex:none}.dw .dono{width:100%;display:block}
.dc{font-size:4px;font-weight:600;fill:var(--fg)}.ds{font-size:2.5px;fill:var(--mut)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}.chips button{border-radius:99px;font-size:.85rem;padding:.3rem .85rem}.chips button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.sp{width:110px;height:30px}
.lg{all:unset;display:flex;justify-content:space-between;gap:8px;width:100%;cursor:pointer;padding:5px 8px;border-radius:6px;box-sizing:border-box}.lg:hover{background:color-mix(in srgb,var(--fg) 7%,transparent)}.lg:focus-visible{outline:2px solid var(--acc)}.lg.off{opacity:.45;text-decoration:line-through}
section.pn{margin-bottom:24px}
@media(max-width:640px){.hm{display:none}.pn{padding:14px;border-radius:10px}main{padding-top:16px}h1{font-size:2rem}.kp{gap:18px}}
.chat{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:24px;align-items:start}
.cl{display:flex;flex-direction:column;height:calc(100vh - 150px);min-height:460px;padding:0}
.log{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:12px}
.m{max-width:min(640px,88%);padding:10px 14px;border-radius:14px;line-height:1.55;font-size:.94rem}
.m.ai{align-self:flex-start;border:1px solid var(--line);border-bottom-left-radius:4px}
.m.me{align-self:flex-end;background:color-mix(in srgb,var(--acc) 14%,transparent);border-bottom-right-radius:4px}
.cin{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line);align-items:flex-end}
.cin textarea{flex:1;font:inherit;resize:none;max-height:140px;padding:.55rem .7rem;border:1px solid var(--line);border-radius:8px;background:var(--surf);color:var(--fg)}
.qs{display:grid;gap:8px}.qs button{text-align:left;border-radius:8px}
.ck{display:flex;gap:8px;align-items:center;color:var(--fg);font-size:.9rem;padding:3px 0}.ck input{width:auto}
.dt{display:inline-flex;gap:4px;padding:4px 0}.dt i{width:6px;height:6px;border-radius:50%;background:var(--mut);animation:bl 1s infinite}.dt i:nth-child(2){animation-delay:.15s}.dt i:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,60%,100%{opacity:.25}30%{opacity:1}}
@media(prefers-reduced-motion:reduce){.dt i{animation:none}}
@media(max-width:900px){.chat{grid-template-columns:1fr}.cl{height:72vh}}
aside{position:sticky;top:0;height:100vh;width:360px;border-left:1px solid var(--line);background:var(--surf);display:flex;flex-direction:column}
aside.wide{width:min(580px,42vw)}aside.off{display:none}
.ah{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line)}
.ah b{font-size:.98rem}.ah small{display:block;color:var(--mut);font-size:.78rem}.ah>div:last-child{display:flex;gap:6px}
.ib{padding:.3rem .6rem;font-size:.82rem}
.ctxd{padding:10px 16px;border-bottom:1px solid var(--line);font-size:.85rem}.ctxd summary{cursor:pointer;color:var(--mut)}
.sq{display:flex;gap:6px;flex-wrap:wrap;padding:10px 16px 0}.sq button{font-size:.8rem;padding:.25rem .7rem;border-radius:99px;text-align:left}
.lnc{position:fixed;right:20px;bottom:20px;z-index:15;border-radius:99px;padding:.65rem 1.1rem;box-shadow:0 6px 20px rgba(0,0,0,.18)}
.brand b{display:block;font-size:1.15rem;letter-spacing:-.02em}
.tg{margin:4px 0 0;font-size:.78rem;color:var(--fg);line-height:1.35;font-weight:500}.ds2{margin:8px 0 0;font-size:.78rem;color:var(--mut);line-height:1.4;font-weight:400}
.mb{display:none;font-weight:650;color:var(--fg)}
@media(max-width:1100px){aside{position:fixed;right:0;top:0;bottom:0;z-index:20;width:min(100%,420px)!important;box-shadow:-8px 0 30px rgba(0,0,0,.2)}}
@media(max-width:860px){
 .app{grid-template-columns:1fr}
 nav{height:auto;position:sticky;top:0;z-index:2;flex-direction:row;overflow-x:auto;padding:10px 12px;background:var(--bg);border-right:0;border-bottom:1px solid var(--line)}
 .brand,nav small{display:none}
 .mb{display:inline}
 nav a{padding:6px 12px;border-left:0;border-bottom:2px solid transparent;white-space:nowrap}
 nav a.on{border-bottom-color:var(--acc)}
 .two,.grid3{grid-template-columns:1fr;gap:32px}
 .alo{flex-direction:column;align-items:flex-start}
}
.chip.d{border-color:var(--dn);color:var(--dn)}
.chip.man{border-color:var(--c2);color:#8a6a12}
.chip{max-width:min(360px,60vw);overflow:hidden;text-overflow:ellipsis;vertical-align:middle}
.lk{all:unset;cursor:pointer;font-weight:600;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.lk:hover{text-decoration-color:var(--acc)}.lk:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
td input{padding:.3rem .45rem;width:114px;max-width:none;text-align:right}
td input.nav{width:100%}
.nl2{list-style:none;margin:0;padding:0}
.nl2 li{padding:11px 0;border-bottom:1px solid var(--line);font-size:.9rem}
.nh{display:flex;gap:12px;justify-content:space-between;align-items:flex-start}
.nh>a{color:var(--fg);text-decoration:none;line-height:1.4}
.nh>a:hover{text-decoration:underline;text-decoration-color:var(--acc)}
.nh .chip{max-width:none}
.nm{color:var(--mut);font-size:.8rem;margin-top:5px}
.nm a{color:var(--mut)}
.chart{width:100%;display:block;height:auto}
.ctip{color:var(--mut);font-size:.85rem;min-height:1.4em;padding:4px 0 8px}
.ctip b{color:var(--fg)}
</style>
</head>
<body>
<div class="app">
<nav id="nav"></nav>
<main>
<div class="top"><span class="mb">DOIntelligence</span><span id="stat"></span><div style="display:flex;gap:8px"><button id="th"></button><button id="reload">Muat ulang data</button></div></div>
<div id="view"></div>
</main>
<aside id="ai" aria-label="Asisten AI"></aside>
</div>
<button class="lnc pri" id="ln" hidden>Tanya asisten</button>
<script>
const $=s=>document.querySelector(s);
const idr=n=>'Rp'+Math.round(n).toLocaleString('id-ID');
const cmp=n=>new Intl.NumberFormat('id-ID',{notation:'compact',maximumFractionDigits:2}).format(n);
const money=x=>'Rp'+cmp(x*1e6);
const pct=n=>(n>=0?'+':'')+n.toFixed(2).replace('.',',')+'%';
const cls=n=>n>=0?'up':'dn';
const rnd=s=>()=>(s=s*16807%2147483647)/2147483647;
const walk=(seed,n,vol)=>{const r=rnd(seed),a=[1];for(let i=1;i<n;i++)a.push(a[i-1]*(1+(r()-.48)*vol));return a};
const get=async u=>{const c=new AbortController();setTimeout(()=>c.abort(),8000);const r=await fetch(u,{signal:c.signal});if(!r.ok)throw 0;return r.json()};

/* ---------- Katalog aset ----------
   `d` hanyalah harga awal (dummy) sampai data nyata masuk dari pipeline.
   Tiap aset menyimpan sumber + waktu update sendiri supaya label live/dummy
   selalu jujur. */
const CAT=[
{s:'IHSG',n:'Indeks Harga Saham Gabungan',c:'Indeks',d:7200},
{s:'BBCA',n:'Bank Central Asia',c:'Saham IDX',d:9875},
{s:'BBRI',n:'Bank Rakyat Indonesia',c:'Saham IDX',d:4120},
{s:'TLKM',n:'Telkom Indonesia',c:'Saham IDX',d:3380},
{s:'BMRI',n:'Bank Mandiri',c:'Saham IDX',d:5100},
{s:'ASII',n:'Astra International',c:'Saham IDX',d:4950},
{s:'ANTM',n:'Aneka Tambang',c:'Saham IDX',d:2580},
{s:'ICBP',n:'Indofood CBP',c:'Saham IDX',d:11250},
{s:'ADRO',n:'Adaro Energy',c:'Saham IDX',d:2400},
{s:'UNTR',n:'United Tractors',c:'Saham IDX',d:26500},
{s:'GOTO',n:'GoTo Gojek Tokopedia',c:'Saham IDX',d:65},
{s:'AAPL',n:'Apple',c:'Saham global',d:3420000},
{s:'MSFT',n:'Microsoft',c:'Saham global',d:6200000},
{s:'NVDA',n:'NVIDIA',c:'Saham global',d:2850000},
{s:'TSLA',n:'Tesla',c:'Saham global',d:3900000},
{s:'GOOGL',n:'Alphabet',c:'Saham global',d:2900000},
{s:'BTC',n:'Bitcoin',c:'Kripto',d:1.55e9,id:'bitcoin'},
{s:'ETH',n:'Ethereum',c:'Kripto',d:5.6e7,id:'ethereum'},
{s:'SOL',n:'Solana',c:'Kripto',d:3.1e6,id:'solana'},
{s:'USD/IDR',n:'Dolar AS',c:'Forex',d:16500},
{s:'EUR/IDR',n:'Euro',c:'Forex',d:18000},
{s:'SGD/IDR',n:'Dolar Singapura',c:'Forex',d:12300},
{s:'JPY/IDR',n:'Yen Jepang (per 1 yen)',c:'Forex',d:110},
{s:'GBP/IDR',n:'Pound Inggris',c:'Forex',d:21000},
{s:'EMAS',n:'Emas per gram (XAU/IDR)',c:'Emas',d:2150000},
{s:'RDPU',n:'Reksa dana pasar uang',c:'Reksa dana',d:1850},
{s:'RDPT',n:'Reksa dana pendapatan tetap',c:'Reksa dana',d:1420},
{s:'RDS',n:'Reksa dana saham',c:'Reksa dana',d:1180}
];
const W=CAT.map(a=>({...a,p:a.d,ch:0,spark:[],src:'Dummy',live:0,upd:null}));
const mk=(a,i)=>{const s=walk(i+1,30,.015),k=a.p/s[29];a.spark=s.map(x=>x*k);a.ch=(s[29]/s[28]-1)*100;a.src='Dummy'};
W.forEach(mk);

/* ---------- Penyimpanan lokal ---------- */
const store={read(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},write(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}};
const DEMO={holdings:[{s:'BBCA',q:1200,avg:9200},{s:'TLKM',q:3000,avg:3600},{s:'AAPL',q:1.5,avg:3100000},{s:'BTC',q:.012,avg:1.2e9},{s:'ETH',q:.4,avg:4.6e7},{s:'EMAS',q:20,avg:1.9e6},{s:'RDPU',q:8000,avg:1700}],tx:[],demo:true};
let PORT=store.read('di.portfolio',null)||JSON.parse(JSON.stringify(DEMO));
let H=Array.isArray(PORT.holdings)?PORT.holdings:[];
let ALR=store.read('di.alerts',null)||{rules:[{id:'a1',s:'BTC',d:'>=',t:1.6e9,armed:true},{id:'a2',s:'BBCA',d:'<=',t:9500,armed:true}],log:[],cfg:{os:true,type:'telegram',hook:'',chat:''}};
ALR.log=ALR.log||[];ALR.cfg=ALR.cfg||{os:true,type:'telegram',hook:'',chat:''};
let A=ALR.rules;
let NAVM=store.read('di.nav',{});
let CHKMSG='';
let S=[];      // berita nyata beserta skornya
let NEWS=[];   // item berita lengkap
const F={mode:'A'};
const FEED={market:null,news:null,at:null,err:''};
const HIST={}; // seri harga historis per simbol
const tgl=iso=>iso?new Date(iso).toLocaleString('id-ID',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'—';
const saveP=()=>{PORT.holdings=H;store.write('di.portfolio',PORT)};
const saveA=()=>{ALR.rules=A;store.write('di.alerts',ALR)};
const saveN=()=>store.write('di.nav',NAVM);

/* ---------- Label sumber data ---------- */
const srcOf=a=>a.manual?{k:'man',l:'Input manual'}:a.live?{k:'t',l:a.src}:{k:'d',l:'Dummy'};
const srcChip=a=>{const s=srcOf(a);return `<span class="chip ${s.k}"${a.srcUrl?` title="${a.srcUrl}"`:''}>${s.l}${a.upd?' · '+tgl(a.upd):''}</span>`};
const chg=a=>a.ch==null?'—':pct(a.ch);

/* ---------- Pipeline data (GitHub Actions -> cabang `data`) ---------- */
const DATA_RAW='https://raw.githubusercontent.com/sxpistols/dointelligence/data/';
async function getJSON(name){
 for(const u of ['data/'+name,DATA_RAW+name]){
  try{const j=await get(u+'?t='+Date.now());if(j)return j}catch(e){}
 }
 return null;
}
function applyMarket(m){
 if(!m||!Array.isArray(m.assets))return false;
 FEED.market=m;FEED.at=m.generatedAt;
 m.assets.forEach(x=>{
  if(!x||!isFinite(x.price))return;
  let a=W.find(w=>w.s===x.symbol);
  if(!a){a={s:x.symbol,n:x.name||x.symbol,c:x.cls||'Lainnya',p:x.price,ch:0,spark:[]};W.push(a)}
  a.p=x.price;a.ch=x.changePct==null?null:x.changePct;a.spark=Array.isArray(x.spark)?x.spark:[];
  a.src=x.source||'Yahoo Finance';a.srcUrl=x.sourceUrl;a.upd=x.asOf;a.live=1;a.manual=0;
  if(x.name)a.n=x.name;
 });
 return true;
}
function applyFx(j){
 if(!j||!j.rates||!j.rates.IDR)return false;
 const base=j.rates.IDR,at=j.date?new Date(j.date+'T16:00:00Z').toISOString():new Date().toISOString();
 const set=(sym,v)=>{const a=W.find(w=>w.s===sym);if(!a||!isFinite(v)||v<=0)return;a.p=+v.toFixed(4);a.src='Frankfurter, kurs harian ECB';a.srcUrl='https://frankfurter.dev';a.upd=at;a.live=1;a.manual=0;a.ch=null;a.spark=[]};
 set('USD/IDR',base);
 ['EUR','SGD','JPY','GBP'].forEach(c=>{if(j.rates[c])set(c+'/IDR',base/j.rates[c])});
 return true;
}
function applyNav(){
 W.filter(a=>a.c==='Reksa dana').forEach(a=>{
  const v=NAVM[a.s];
  if(v&&isFinite(v.nav)&&+v.nav>0){a.p=+v.nav;a.upd=v.at;a.src='Input manual (NAV)';a.live=0;a.manual=1;a.ch=null;a.spark=[]}
  else{a.p=a.d;a.src='Dummy';a.live=0;a.manual=0;a.ch=null;a.spark=[]}
 });
}
function settle(){
 W.forEach(a=>{if(!a.live&&!a.manual){a.src='Dummy';a.ch=null;a.spark=[]}});
}

/* ---------- Sentimen berita (lexicon Bahasa Indonesia) ---------- */

const NEGATORS=/^(tidak|bukan|belum|tanpa|tak|kurang|minim)$/;
function sentScore(t){
 const w=String(t||'').toLowerCase().replace(/[^a-z0-9\s-]/g,' ').split(/\s+/).filter(Boolean);
 let p=0,n=0,hits=0;
 w.forEach((x,i)=>{

  p+=a;n+=b;hits++;

}

 if(!use.length)return null;

/* ---------- Indikator teknikal ---------- */
function ema(a,p){const k=2/(p+1),out=Array(a.length).fill(null);let prev=null;for(let i=0;i<a.length;i++){if(i<p-1)continue;if(prev==null){prev=a.slice(0,p).reduce((x,y)=>x+y,0)/p}else prev=a[i]*k+prev*(1-k);out[i]=prev}return out}
const sma=(a,p)=>a.map((_,i)=>i<p-1?null:a.slice(i-p+1,i+1).reduce((x,y)=>x+y,0)/p);
function rsi(a,p=14){
 const out=Array(a.length).fill(null);let ag=0,al=0;
 for(let i=1;i<a.length;i++){
  const d=a[i]-a[i-1],g=Math.max(d,0),l=Math.max(-d,0);
  if(i<=p){ag+=g;al+=l;if(i===p){ag/=p;al/=p;out[i]=al===0?100:100-100/(1+ag/al)}}
  else{ag=(ag*(p-1)+g)/p;al=(al*(p-1)+l)/p;out[i]=al===0?100:100-100/(1+ag/al)}
 }
 return out;
}
function macd(a,f=12,s=26,g=9){
 const ef=ema(a,f),es=ema(a,s),line=a.map((_,i)=>ef[i]!=null&&es[i]!=null?ef[i]-es[i]:null);
 const idx=line.map((v,i)=>v==null?null:i).filter(v=>v!=null),vals=idx.map(i=>line[i]),sg=ema(vals,g);
 const signal=Array(a.length).fill(null);idx.forEach((i,k)=>{if(sg[k]!=null)signal[i]=sg[k]});
 return {line,signal,hist:line.map((v,i)=>v!=null&&signal[i]!=null?v-signal[i]:null)};
}
function srLevels(bars){
 const c=bars.at(-1)[4],Wn=3,hi=[],lo=[];
 for(let i=Wn;i<bars.length-Wn;i++){
  let isH=true,isL=true;
  for(let j=i-Wn;j<=i+Wn;j++){if(j===i)continue;if(bars[j][2]>=bars[i][2])isH=false;if(bars[j][3]<=bars[i][3])isL=false}
  if(isH)hi.push(bars[i][2]);if(isL)lo.push(bars[i][3]);
 }

 return {res,sup};
}

}

const npv=(r,f)=>f.reduce((s,c,i)=>s+c/Math.pow(1+r,i),0);
const irr=f=>{let lo=-.99,hi=10,a=npv(lo,f);if(a*npv(hi,f)>0)return null;for(let i=0;i<200;i++){const m=(lo+hi)/2,v=npv(m,f);if(a*v<=0)hi=m;else{lo=m;a=v}}return(lo+hi)/2};
const P=x=>(x*100).toFixed(2).replace('.',',')+'%';
function calc(){
 const v=id=>parseFloat($('#'+id).value),ke=v('rf')+v('beta')*v('erp'),we=v('we')/100,w=(we*ke+(1-we)*v('kd')*(1-v('tx')/100))/100;
 const head=`<div><div>Biaya ekuitas (CAPM)</div></div>`;let rs,sn;
 if(F.mode==='A'){
  const gt=v('gt')/100,px=v('px'),
  fv=(r,g)=>{if(r<=g)return NaN;let pv=0,c=v('fcf');for(let i=1;i<=5;i++){c*=1+v('g')/100;pv+=c/Math.pow(1+r,i)}return(pv+c*(1+g)/(r-g)/Math.pow(1+r,5)-v('nd'))/v('sh')},
  fair=fv(w,gt);
  let imp=null,lo=gt+.0005,hi=.6;if(fv(lo,gt)>=px&&fv(hi,gt)<=px){for(let i=0;i<100;i++){const m=(lo+hi)/2;fv(m,gt)>px?lo=m:hi=m}imp=(lo+hi)/2}
  const mos=fair/px-1;
  rs=`<h2>Hasil</h2><dl><div><dt>Biaya ekuitas</dt><dd>${P(ke/100)}</dd></div><div><dt>WACC</dt><dd>${P(w)}</dd></div><div><dt>Nilai wajar per saham</dt><dd>${isNaN(fair)?'—':idr(fair)}</dd></div><div><dt>NPV per saham (nilai wajar − harga)</dt><dd class="${cls(fair-px)}">${isNaN(fair)?'—':idr(fair-px)}</dd></div><div><dt>IRR implisit (return jika beli di harga pasar)</dt><dd>${imp==null?'—':P(imp)}</dd></div></dl>
  <p class="note">${isNaN(fair)?'WACC harus lebih besar dari pertumbuhan terminal.':`Pada asumsi ini nilai wajar ${mos>=0?'di atas':'di bawah'} harga pasar sebesar ${Math.abs(mos*100).toFixed(1).replace('.',',')}%. Hasil sangat bergantung pada asumsi dan bukan saran investasi.`}</p>`;
  const d=[-.02,-.01,0,.01,.02];
  sn=`<h2>Sensitivitas nilai wajar per saham</h2><div class="sc"><table><tr><th>WACC \\ pertumbuhan terminal</th>${d.map(x=>`<th>${P(gt+x)}</th>`).join('')}</tr>${d.map(y=>`<tr><td>${P(w+y)}</td>${d.map(x=>{const z=fv(w+y,gt+x);return `<td class="${isNaN(z)?'':z>=px?'hu':'hd'}">${isNaN(z)?'—':idr(z)}</td>`}).join('')}</tr>`).join('')}</table></div>`;
 }else{
  const inv=v('inv'),cf=$('#cf').value.split(',').map(parseFloat).filter(x=>!isNaN(x)),fl=[-inv,...cf],ds=$('#ds').value===''?w:parseFloat($('#ds').value)/100;
  const N=npv(ds,fl),R=irr(fl),pi=(N+inv)/inv;let cum=-inv,pb=null;
  for(let i=1;i<fl.length;i++){if(cum+fl[i]>=0){pb=i-1+(-cum)/fl[i];break}cum+=fl[i]}
  let c=0;const dc=fl.map((x,i)=>c+=x/Math.pow(1+ds,i));
  rs=`<h2>Hasil</h2><dl><div><dt>WACC dari input</dt><dd>${P(w)}</dd></div><div><dt>Tingkat diskonto dipakai</dt><dd>${P(ds)}</dd></div><div><dt>NPV</dt><dd class="${cls(N)}">${money(N)}</dd></div><div><dt>IRR</dt><dd>${R==null?'—':P(R)}</dd></div><div><dt>Payback sederhana</dt><dd>${pb==null?'Belum kembali':pb.toFixed(1).replace('.',',')+' tahun'}</dd></div><div><dt>Profitability index</dt><dd>${pi.toFixed(2).replace('.',',')}</dd></div></dl>
  <p class="note">${R==null?'IRR tidak ditemukan: arus kas tidak berganti tanda.':N>0&&R>ds?'Layak menurut NPV dan IRR pada asumsi ini.':'Belum layak menurut NPV atau IRR pada asumsi ini.'} Hasil bergantung pada asumsi dan bukan saran investasi.</p>${bars(dc)}<p class="note">Arus kas kumulatif terdiskonto per tahun (tahun 0 sampai ${fl.length-1}).</p>`;
  const d=[-.02,-.01,0,.01,.02],m=[.8,.9,1,1.1,1.2];
  sn=`<h2>Sensitivitas NPV</h2><div class="sc"><table><tr><th>Diskonto \\ arus kas</th>${m.map(x=>`<th>${Math.round(x*100)}%</th>`).join('')}</tr>${d.map(y=>`<tr><td>${P(ds+y)}</td>${m.map(x=>{const z=npv(ds+y,[fl[0],...fl.slice(1).map(q=>q*x)]);return `<td class="${z>=0?'hu':'hd'}">${money(z)}</td>`}).join('')}</tr>`).join('')}</table></div>`;
 }

function chartSvg(bars){
 const H1=290,H2=96,H3=96,GAP=24,TOP=26,n=bars.length,x=i=>CPL+(n<2?CIW/2:(i/(n-1))*CIW);
 const closes=bars.map(b=>b[4]),ma20=sma(closes,20),ma50=sma(closes,50),R=rsi(closes),M=macd(closes),{res:rs,sup:sp}=srLevels(bars);
 const lo=Math.min(Math.min(...bars.map(b=>b[3])),sp),hi=Math.max(Math.max(...bars.map(b=>b[2])),rs);
 const pd=(hi-lo)*0.06||1,mn=lo-pd,mx=hi+pd,yP=v=>TOP+(1-(v-mn)/(mx-mn))*(H1-TOP*2);
 const yR0=H1+GAP,yM0=yR0+H2+GAP,yR=v=>yR0+H2-10-(v/100)*(H2-20);

 let g='';

  `<line x1="${CPL}" x2="${CW-CPR}" y1="${yP(sp).toFixed(1)}" y2="${yP(sp).toFixed(1)}" stroke="var(--up)" stroke-dasharray="5 4" opacity=".65"/><text x="${CW-CPR+4}" y="${(yP(sp)+4).toFixed(1)}" class="tx" fill="var(--up)">S</text>`;
 let rg='';
 [30,50,70].forEach(v=>{rg+=`<line x1="${CPL}" x2="${CW-CPR}" y1="${yR(v).toFixed(1)}" y2="${yR(v).toFixed(1)}" class="gr"/><text x="${CPL-8}" y="${(yR(v)+4).toFixed(1)}" class="tx" text-anchor="end">${v}</text>`});
 let mg=`<line x1="${CPL}" x2="${CW-CPR}" y1="${yM(0).toFixed(1)}" y2="${yM(0).toFixed(1)}" class="gr"/>`;
 bars.forEach((b,i)=>{const v=M.hist[i];if(v==null)return;const xx=x(i),y0=yM(0),y1=yM(v);
  mg+=`<rect x="${(xx-cw/2).toFixed(1)}" y="${Math.min(y0,y1).toFixed(1)}" width="${cw.toFixed(1)}" height="${Math.max(1,Math.abs(y1-y0)).toFixed(1)}" fill="${v>=0?'var(--up)':'var(--dn)'}" opacity=".55"/>`});
 return `<svg id="csv" class="chart" viewBox="0 0 ${CW} ${Hh}" role="img" aria-label="Grafik candlestick dengan indikator">
 <text x="${CPL}" y="14" class="tx">Harga, MA20 (biru), MA50 (kuning), garis support (S) / resistance (R)</text>

 const a=W.find(x=>x.s===sym)||{s:sym,n:sym,c:'',p:0,ch:null};
 const ser=HIST[sym],allB=ser&&ser.bars?ser.bars:[],bars=allB.slice(-CHR);
 const opts=W.map(x=>`<option value="${x.s}" ${x.s===sym?'selected':''}>${x.s} · ${x.c}</option>`).join('');
 const head=`<h1 class="pg">Grafik</h1>
 <div class="hd2" style="margin-bottom:16px"><div><b style="font-size:1.1rem">${a.s}</b> <span style="color:var(--mut)">${a.n||''}</span><div class="note" style="margin:2px 0 0">${a.c||''} · harga ${a.p?idr(a.p):'—'} ${a.ch==null?'':'· '+pct(a.ch)}</div></div>
 <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><select id="chs" style="width:auto">${opts}</select><div class="rng">${[[63,'3 bln'],[126,'6 bln'],[250,'1 thn']].map(([d,l])=>`<button data-cr="${d}" class="${d===CHR?'on':''}">${l}</button>`).join('')}</div></div></div>`;
 if(!bars.length){
  $('#view').innerHTML=head+`<div class="pn"><b>Histori harga ${sym} belum tersedia.</b><p class="note" style="margin:6px 0 0">Grafik hanya digambar dari data nyata. Saham, indeks, emas, dan forex diambil pipeline <code>scripts/fetch-data.mjs</code>; kripto diambil langsung dari CoinGecko; NAV reksa dana tidak punya sumber histori gratis, jadi grafiknya tidak disediakan.</p></div>`;
  ensureBars(sym);bindGrafik(bars);return;
 }
 const closes=bars.map(b=>b[4]),ma20=sma(closes,20),ma50=sma(closes,50),R=rsi(closes),M=macd(closes),{res:rs,sup:sp}=srLevels(bars);
 const last=i=>bars.at(-1)[i],rsN=R.at(-1),lastM=M.line.at(-1),lastS=M.signal.at(-1);
 const sig=rsN==null?'':rsN>70?'jenuh beli':rsN<30?'jenuh jual':'netral';
 $('#view').innerHTML=head+`
 <div class="pn" style="margin-bottom:24px"><div class="ctip" id="ctip">Arahkan kursor ke grafik untuk detail per candle.</div>${chartSvg(bars)}
 <p class="note">Sumber: ${ser&&ser.source?ser.source:'—'} · data per ${tgl(ser&&ser.asOf?ser.asOf:null)} · ${bars.length} candle harian. Garis putus-putus R/S dihitung dari pivot high/low terdekat (jendela 3 candle); MA dan RSI memakai penutupan harian.</p></div>
 <div class="two"><div class="pn"><h2>Nilai indikator terakhir</h2><dl>
 <div><dt>Penutupan terakhir</dt><dd>${idr(last(4))}</dd></div>
 <div><dt>MA 20</dt><dd>${ma20.at(-1)==null?'—':idr(ma20.at(-1))}</dd></div>
 <div><dt>MA 50</dt><dd>${ma50.at(-1)==null?'—':idr(ma50.at(-1))}</dd></div>
 <div><dt>Tren terhadap MA20</dt><dd class="${ma20.at(-1)==null?'':cls(last(4)-ma20.at(-1))}">${ma20.at(-1)==null?'—':cls(last(4)-ma20.at(-1))==='up'?'di atas':'di bawah'}</dd></div>
 <div><dt>RSI 14</dt><dd>${rsN==null?'—':rsN.toFixed(1)+' ('+sig+')'}</dd></div>
 <div><dt>MACD</dt><dd>${lastM==null?'—':lastM.toFixed(0)}</dd></div>
 <div><dt>Garis sinyal</dt><dd>${lastS==null?'—':lastS.toFixed(0)}</dd></div>
 <div><dt>Histogram</dt><dd class="${lastM==null||lastS==null?'':cls(lastM-lastS)}">${lastM==null||lastS==null?'—':(lastM-lastS).toFixed(0)}</dd></div>
 <div><dt>Resistance (R)</dt><dd>${idr(rs)}</dd></div>
 <div><dt>Support (S)</dt><dd>${idr(sp)}</dd></div></dl></div>
 <div class="pn"><h2>Cara membaca</h2><ul class="note" style="padding-left:18px;margin:0">
 <li>Harga di atas MA20 dan MA50 menandakan tren naik jangka pendek dan menengah; di bawah keduanya sebaliknya.</li>
 <li>RSI di atas 70 sering disebut jenuh beli, di bawah 30 jenuh jual. RSI bukan sinyal jual/beli tunggal.</li>
 <li>MACD memotong ke atas garis sinyal = momentum menguat; histogram mengecil = momentum melemah.</li>
 <li>Support/resistance adalah level harga tempat pembalikan sering terjadi, bukan harga pasti.</li>
 <li>Semua nilai dihitung dari data nyata di atas, bukan data contoh. Bukan saran investasi.</li></ul></div></div>`;
 bindGrafik(bars);
}
function bindGrafik(bars){
 const sel=$('#chs');if(sel)sel.onchange=()=>{location.hash='grafik/'+encodeURIComponent(sel.value)};
 document.querySelectorAll('[data-cr]').forEach(b=>b.onclick=()=>{CHR=+b.dataset.cr;grafik()});
 const svg=$('#csv'),tip=$('#ctip'),xl=svg&&svg.querySelector('#xl');
 if(!svg||!bars.length)return;
 const n=bars.length,closes=bars.map(b=>b[4]),ma20=sma(closes,20),ma50=sma(closes,50),R=rsi(closes),M=macd(closes);
 const move=e=>{
  const r=svg.getBoundingClientRect(),px=((e.touches?e.touches[0].clientX:e.clientX)-r.left)/r.width*CW;
  const i=Math.max(0,Math.min(n-1,Math.round((px-CPL)/CIW*(n-1)))),b=bars[i],xx=CPL+(n<2?CIW/2:(i/(n-1))*CIW);
  xl.style.display='';xl.setAttribute('x1',xx);xl.setAttribute('x2',xx);
  tip.innerHTML=`<b>${new Date(b[0]*1000).toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'})}</b> · buka ${idr(b[1])} · tinggi ${idr(b[2])} · rendah ${idr(b[3])} · tutup ${idr(b[4])} · MA20 ${ma20[i]==null?'—':idr(ma20[i])} · MA50 ${ma50[i]==null?'—':idr(ma50[i])} · RSI ${R[i]==null?'—':R[i].toFixed(1)} · MACD ${M.line[i]==null?'—':M.line[i].toFixed(0)}`;
 };
 svg.onmousemove=move;svg.ontouchmove=move;
 svg.onmouseleave=()=>{xl.style.display='none';tip.innerHTML='Arahkan kursor ke grafik untuk detail per candle.'};
}

/* ---------- Portofolio yang bisa diedit ---------- */
function portofolio(){
 const rows=H.map((h,i)=>{const a=W.find(x=>x.s===h.s);return{h,i,a}}).filter(r=>r.a);
 const opt=W.map(a=>`<option value="${a.s}">${a.s} · ${a.n}</option>`).join('');
 const total=rows.reduce((s,r)=>s+r.h.q*r.a.p,0),modal=rows.reduce((s,r)=>s+r.h.q*r.h.avg,0)||1;
 const rd=['RDPU','RDPT','RDS'];
 $('#view').innerHTML=`<h1 class="pg">Portofolio</h1>
 ${PORT.demo?`<div class="pn" id="demob" style="border-color:var(--c2);margin-bottom:20px"><b>Ini portofolio contoh.</b><p class="note" style="margin:6px 0 0">Ubah, tambah, atau hapus posisinya. Begitu Anda menyimpan perubahan, label contoh hilang dan data menjadi portofolio Anda sendiri.</p></div>`:''}
 <div class="pn sc" style="margin-bottom:24px"><div class="hd2"><h2 style="margin:0">Posisi saat ini</h2><div class="note" id="sum">Nilai ${idr(total)} · modal ${idr(modal)} · hasil <b class="${cls(total-modal)}">${idr(total-modal)} (${pct((total/modal-1)*100)})</b></div></div>
 <table style="margin-top:12px"><tr><th>Aset</th><th>Jumlah</th><th>Harga rata-rata</th><th>Harga kini</th><th>Nilai</th><th></th></tr>
 ${rows.length?rows.map(r=>`<tr><td>${r.a.s}<small>${r.a.n}</small></td><td><input class="ed" data-i="${r.i}" data-f="q" type="number" step="any" min="0" value="${r.h.q}" aria-label="Jumlah ${r.a.s}"></td><td><input class="ed" data-i="${r.i}" data-f="avg" type="number" step="any" min="0" value="${r.h.avg}" aria-label="Harga rata-rata ${r.a.s}"></td><td>${idr(r.a.p)}<small>${srcOf(r.a).l}</small></td><td id="rv${r.i}">${idr(r.h.q*r.a.p)}</td><td><button data-del="${r.i}">Hapus</button></td></tr>`).join(''):'<tr><td colspan="6" class="l">Belum ada posisi.</td></tr>'}</table>
 <p class="note">Ubah jumlah atau harga rata-rata langsung di tabel; perubahan tersimpan otomatis setelah Anda menekan Tab atau klik di luar kolom.</p></div>
 <div class="two"><div class="pn"><h2>Catat transaksi</h2>
 <div style="display:grid;gap:10px"><label>Aset<select id="ts">${opt}</select></label>
 <label>Jenis<select id="tk"><option value="beli">Beli</option><option value="jual">Jual</option></select></label>
 <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><label>Jumlah<input id="tq" type="number" step="any" min="0" placeholder="misal 100"></label><label>Harga per unit (Rp)<input id="tp" type="number" step="any" min="0"></label></div>
 <label>Tanggal<input id="td" type="date" value="${new Date().toISOString().slice(0,10)}"></label>
 <label>Catatan (opsional)<input id="tn" placeholder="misal beli bertahap"></label>
 <button class="pri" id="tadd">Simpan transaksi</button></div><p class="note" id="tmsg"></p></div>
 <div class="pn"><h2>NAV reksa dana (input manual)</h2><div style="display:grid;gap:10px">${rd.map(s=>{const a=W.find(x=>x.s===s),v=NAVM[s];return `<label>${s} — ${a?a.n:''}<input class="nav" data-s="${s}" type="number" step="any" min="0" value="${v&&v.nav?v.nav:''}" placeholder="NAV per unit"></label><div class="note" style="margin:-6px 0 4px">${v&&v.at?'Diperbarui '+tgl(v.at):'Belum diisi — harga masih dummy'}</div>`}).join('')}</div>
 <p class="note">Tidak ada API gratis untuk NAV reksa dana, jadi angkanya Anda isi sendiri dan diberi label input manual beserta waktu isian.</p></div></div>
 <div class="pn sc" style="margin-top:24px"><h2>Riwayat transaksi</h2><table><tr><th>Tanggal</th><th>Aset</th><th>Jenis</th><th>Jumlah</th><th>Harga</th><th class="l">Catatan</th><th></th></tr>
 ${PORT.tx&&PORT.tx.length?PORT.tx.map((t,i)=>`<tr><td>${t.date||tgl(t.at)}</td><td>${t.s}</td><td>${t.kind==='beli'?'Beli':'Jual'}</td><td>${t.q}</td><td>${idr(t.p)}</td><td class="l">${esc(t.note||'')}</td><td><button data-tx="${i}">Hapus</button></td></tr>`).join(''):'<tr><td colspan="7" class="l">Belum ada transaksi tercatat.</td></tr>'}</table>
 <p class="note">Menghapus catatan transaksi tidak mengubah posisi; ubah posisi langsung di tabel di atas bila perlu.</p></div>
 <div class="pn" style="margin-top:24px"><h2>Cadangan data</h2><div style="display:flex;gap:8px;flex-wrap:wrap">
 <button id="exp">Ekspor JSON</button><button id="impb">Impor JSON</button><input type="file" id="imp" accept="application/json" hidden><button id="rst">Reset ke portofolio contoh</button></div>
 <p class="note">Data portofolio, alert, dan NAV manual tersimpan di localStorage peramban ini. Ekspor untuk mencadangkan atau memindahkannya ke peramban lain.</p></div>`;
 const recount=()=>{
  const t=H.reduce((s,h)=>{const a=W.find(x=>x.s===h.s);return s+(a?h.q*a.p:0)},0),m=H.reduce((s,h)=>s+h.q*h.avg,0)||1,sm=$('#sum');
  if(sm)sm.innerHTML=`Nilai ${idr(t)} · modal ${idr(m)} · hasil <b class="${cls(t-m)}">${idr(t-m)} (${pct((t/m-1)*100)})</b>`;
  H.forEach((h,i)=>{const a=W.find(x=>x.s===h.s),c=$('#rv'+i);if(a&&c)c.textContent=idr(h.q*a.p)});
  const dm=$('#demob');if(dm)dm.remove();
 };
 document.querySelectorAll('.ed').forEach(inp=>{
  const commit=()=>{const i=+inp.dataset.i,v=parseFloat(inp.value);if(!isFinite(v)||v<0)return;H[i][inp.dataset.f==='avg'?'avg':'q']=v;PORT.demo=false;saveP();recount()};
  inp.oninput=commit;inp.onchange=commit;
 });
 document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{H.splice(+b.dataset.del,1);PORT.demo=false;saveP();portofolio()});
 document.querySelectorAll('.nav').forEach(inp=>inp.onchange=()=>{const v=parseFloat(inp.value),s=inp.dataset.s;if(isFinite(v)&&v>0)NAVM[s]={nav:v,at:new Date().toISOString()};else delete NAVM[s];saveN();applyNav();settle();route()});
 $('#tadd').onclick=()=>{
  const s=$('#ts').value,kind=$('#tk').value,q=parseFloat($('#tq').value),p=parseFloat($('#tp').value),d=$('#td').value,n=$('#tn').value.trim(),msg=$('#tmsg');
  if(!isFinite(q)||q<=0)return msg.textContent='Jumlah harus lebih dari nol.';
  const a=W.find(x=>x.s===s),px=isFinite(p)&&p>0?p:a.p;
  const h=H.find(x=>x.s===s);
  if(kind==='beli'){if(h){const tq=h.q+q;h.avg=(h.q*h.avg+q*px)/tq;h.q=tq}else H.push({s,q,avg:px})}
  else{if(!h)return msg.textContent='Tidak ada posisi '+s+' untuk dijual.';if(q>h.q)return msg.textContent='Jumlah jual melebihi posisi.';h.q-=q;if(h.q<=1e-9)H.splice(H.indexOf(h),1)}
  PORT.tx=PORT.tx||[];PORT.tx.unshift({at:new Date().toISOString(),date:d,s,kind,q,p:px,note:n});PORT.demo=false;saveP();portofolio();
 };
 document.querySelectorAll('[data-tx]').forEach(b=>b.onclick=()=>{PORT.tx.splice(+b.dataset.tx,1);saveP();portofolio()});
 $('#exp').onclick=()=>{
  const data={app:'DOIntelligence',v:1,at:new Date().toISOString(),portfolio:{holdings:H,tx:PORT.tx||[]},alerts:ALR,nav:NAVM};
  const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'})),link=document.createElement('a');
  link.href=url;link.download='dointelligence-'+new Date().toISOString().slice(0,10)+'.json';link.click();URL.revokeObjectURL(url);
 };
 $('#impb').onclick=()=>$('#imp').click();
 $('#imp').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const rd2=new FileReader();
  rd2.onload=()=>{try{
   const j=JSON.parse(rd2.result);
   if(j.portfolio&&Array.isArray(j.portfolio.holdings)){H=j.portfolio.holdings.filter(x=>x&&x.s&&isFinite(x.q)&&isFinite(x.avg));PORT={holdings:H,tx:Array.isArray(j.portfolio.tx)?j.portfolio.tx:[],demo:false}}
   if(j.alerts&&Array.isArray(j.alerts.rules)){ALR=j.alerts;ALR.log=ALR.log||[];ALR.cfg=ALR.cfg||{os:true,type:'telegram',hook:'',chat:''};A=ALR.rules;store.write('di.alerts',ALR)}
   if(j.nav&&typeof j.nav==='object'){NAVM=j.nav;saveN()}
   PORT.demo=false;saveP();applyNav();settle();route();alert('Impor berhasil: '+H.length+' posisi, '+A.length+' alert.');
  }catch(err){alert('Berkas tidak dikenali sebagai cadangan DOIntelligence.')}};
  rd2.readAsText(f);
 };
 $('#rst').onclick=()=>{if(!confirm('Kembalikan portofolio contoh? Data portofolio Anda akan diganti.'))return;PORT=JSON.parse(JSON.stringify(DEMO));H=PORT.holdings;saveP();route()};
}



/* ---------- Asisten AI ---------- */
/* Untuk memakai model AI sungguhan: isi endpoint dengan alamat backend Anda (mis. '/api/chat').
   API key HARUS disimpan di backend, jangan pernah di file ini. Backend menerima {messages, context} dan mengembalikan {reply}. */
const AI={endpoint:'',async ask(m,c){if(!AI.endpoint)return mock(m.at(-1).content,c);const r=await fetch(AI.endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:m,context:c})});if(!r.ok)throw 0;return(await r.json()).reply}};
const CH=[{r:'ai',t:'Halo, saya asisten DOIntelligence. Saya ikut melihat halaman yang sedang Anda buka, jadi Anda bisa bertanya seperti "jelaskan hasil di layar". Jawaban saya masih simulasi berbasis aturan, dihitung dari data yang sedang tampil di halaman ini.'}];
const CX={port:1,watch:1,alert:1};let busy=false;
const esc=t=>t.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=t=>esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\n/g,'<br>');
const pf=()=>{const rows=H.map(h=>({h,a:W.find(x=>x.s===h.s)})).filter(x=>x.a).map(({h,a})=>{const v=h.q*a.p,c=h.q*h.avg;return{s:h.s,c:a.c,v,pl:v-c,pp:(v-c)/(c||1)*100}}),tot=rows.reduce((a,r)=>a+r.v,0),cost=rows.reduce((a,r)=>a+r.v-r.pl,0);return{rows,tot,pl:tot-cost,pp:(tot-cost)/(cost||1)*100}};
const ctx=()=>({page:pageCtx(),portfolio:CX.port?pf().rows:undefined,watchlist:CX.watch?W.map(a=>({s:a.s,p:a.p,ch:a.ch,src:a.src})):undefined,alerts:CX.alert?A:undefined});
function mock(q,c){q=q.toLowerCase();
 if(/sumber data/.test(q))return 'Saham IDX, saham global, IHSG, emas, dan forex diambil pipeline Yahoo Finance yang berjalan terjadwal di GitHub Actions; kurs acuan dari ECB lewat Frankfurter. Kripto dari CoinGecko langsung di peramban. NAV reksa dana diisi manual karena tidak ada feed gratisnya. Harga Yahoo tertunda, bukan real-time bursa. Tiap aset menampilkan sumber dan waktu update di kolom Sumber.';
 if(/cara kerja alert/.test(q))return 'Anda menentukan aset, arah (naik hingga atau turun hingga), dan harga target. Alert disimpan di localStorage dan diperiksa saat halaman dibuka serta tiap 5 menit selama terbuka. Saat kondisi terpenuhi, notifikasi sistem dikirim dan/atau webhook Anda dipanggil (mis. bot Telegram); hasilnya tercatat di riwayat alert. Alert tidak pernah dinilai dari data dummy.';
 if(/di layar|halaman ini|yang saya lihat/.test(q)){const g=c.page;if(g.page==='Kelayakan')return 'Hasil yang tampil saat ini: '+(g.hasil||'belum ada')+'.\nNPV positif dan IRR di atas WACC menandakan layak pada asumsi ini. Coba ubah asumsi lalu tanyakan lagi.';if(g.page==='Ringkasan')return `Anda sedang melihat ringkasan portofolio dengan rentang ${g.range}`+(g.disembunyikan.length?`, kelas aset disembunyikan: ${g.disembunyikan.join(', ')}.`:'.');if(g.page==='Watchlist')return `Anda sedang melihat watchlist (filter: ${g.filter}).`;return `Anda sedang berada di halaman ${g.page}.`}
 if(/naik paling|tertinggi|paling tinggi/.test(q)){if(!c.watchlist)return 'Data watchlist tidak dibagikan ke saya. Aktifkan di panel "Data yang dibagikan".';const r=[...W].sort((a,b)=>b.ch-a.ch);return `Kenaikan 24 jam tertinggi: **${r[0].s}** (${pct(r[0].ch)}), lalu **${r[1].s}** (${pct(r[1].ch)}).`}
 const off=k=>`Data ${k} tidak dibagikan ke saya. Aktifkan di panel "Data yang dibagikan" agar saya bisa menjawab.`,sym=W.find(a=>q.includes(a.s.toLowerCase()));
 if(/alert/.test(q)){if(!c.alerts)return off('alert');const t=A.filter(a=>{const p=W.find(x=>x.s===a.s).p;return a.d==='>='?p>=a.t:p<=a.t});return `Ada **${A.length}** alert aktif dan **${t.length}** terpicu.`+(t.length?'\nTerpicu: '+t.map(a=>a.s).join(', ')+'.':'\nBelum ada yang mencapai target.')}
 if(/npv|irr|wacc|layak|dcf/.test(q))return '**NPV** adalah selisih nilai kini arus kas masa depan dengan investasi awal. NPV positif berarti proyek menambah nilai.\n**IRR** adalah tingkat imbal hasil yang membuat NPV sama dengan nol. Proyek layak jika IRR di atas biaya modal.\n**WACC** adalah rata-rata biaya modal dari ekuitas dan utang, dan dipakai sebagai tingkat diskonto.\nCoba ubah asumsi di halaman Kelayakan dan lihat tabel sensitivitasnya. Hasilnya bergantung pada asumsi dan bukan saran investasi.';
 if(/sentimen|berita/.test(q)){const by={};S.forEach(x=>(by[x.s]=by[x.s]||[]).push(x.v));return 'Skor sentimen rata-rata dari berita nyata (skala −1 sampai +1):\n'+Object.entries(by).map(([k,a])=>`• **${k}**: ${(a.reduce((x,y)=>x+y,0)/a.length).toFixed(2).replace('.',',')}`).join('\n')}
 if(!c.portfolio&&/portofolio|alokasi|terbaik|terlemah|untung|rugi|ringkas|total/.test(q))return off('portofolio');
 const P=pf();
 if(/alokasi|komposisi/.test(q)){const by={};P.rows.forEach(r=>by[r.c]=(by[r.c]||0)+r.v);return 'Alokasi aset Anda:\n'+Object.entries(by).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`• **${k}**: ${(v/P.tot*100).toFixed(1).replace('.',',')}%`).join('\n')}
 if(/terbaik|terlemah|untung|rugi|kinerja/.test(q)){const r=[...P.rows].sort((a,b)=>b.pp-a.pp);return `Terbaik: **${r[0].s}** (${pct(r[0].pp)}). Terlemah: **${r.at(-1).s}** (${pct(r.at(-1).pp)}).\nPosisi rugi: ${r.filter(x=>x.pl<0).map(x=>x.s).join(', ')||'tidak ada'}.`}
 if(sym){if(!c.watchlist)return off('watchlist');return `**${sym.s}** (${sym.n}) ${idr(sym.p)}, ${pct(sym.ch)} dalam 24 jam. Sumber data: ${sym.src}.`}
 if(/portofolio|ringkas|nilai|total/.test(q))return `Nilai portofolio **${idr(P.tot)}** dengan hasil **${pct(P.pp)}** (${idr(P.pl)}) dari modal. Terdiri dari ${P.rows.length} aset di ${new Set(P.rows.map(r=>r.c)).size} kelas aset.`;
 return 'Saya belum paham pertanyaan itu. Coba tanyakan tentang ringkasan portofolio, alokasi aset, kinerja aset, alert, sentimen, harga suatu aset, atau arti NPV, IRR, dan WACC.'}
function drawLog(){const l=$('#log');if(!l)return;l.innerHTML=CH.map(m=>`<div class="m ${m.r}">${fmt(m.t)}</div>`).join('')+(busy?'<div class="m ai"><span class="dt" aria-label="Asisten sedang mengetik"><i></i><i></i><i></i></span></div>':'');l.scrollTop=l.scrollHeight}
async function send(t){t=(t||'').trim();if(!t||busy)return;CH.push({r:'me',t});busy=true;drawLog();
 try{await new Promise(r=>setTimeout(r,500+Math.random()*500));const rp=await AI.ask(CH.map(m=>({role:m.r==='me'?'user':'assistant',content:m.t})),ctx());CH.push({r:'ai',t:rp})}
 catch(e){CH.push({r:'ai',t:'Asisten tidak dapat dihubungi. Periksa koneksi ke backend, lalu kirim ulang pesan Anda.'})}
 busy=false;drawLog()}
const PN={'':'Ringkasan',portofolio:'Portofolio',watchlist:'Watchlist',grafik:'Grafik',alert:'Alert',kelayakan:'Kelayakan',sentimen:'Sentimen'};
const PQ={'':['Ringkas portofolio saya','Aset mana yang paling untung dan paling rugi?','Bagaimana alokasi aset saya?'],portofolio:['Bagaimana alokasi aset saya?','Aset mana yang paling untung dan paling rugi?'],watchlist:['Aset mana yang naik paling tinggi hari ini?','Jelaskan sumber data halaman ini'],grafik:['Apa arti RSI dan MACD?','Jelaskan sumber data halaman ini'],alert:['Apakah ada alert yang terpicu?','Jelaskan cara kerja alert'],kelayakan:['Jelaskan hasil di layar','Jelaskan arti NPV, IRR, dan WACC'],sentimen:['Bagaimana sentimen berita saat ini?']};
const pg=()=>{const b=location.hash.slice(1).split('/')[0];return PN[b]!==undefined?b:''};
let CM='open';try{CM=localStorage.getItem('aim')||'open'}catch(e){}
function pageCtx(){const p=pg(),o={page:PN[p]};if(p==='')Object.assign(o,{range:RG+' hari',disembunyikan:[...HID]});if(p==='watchlist')o.filter=WF;if(p==='grafik')o.aset=CHS;if(p==='kelayakan'&&$('#res'))o.hasil=$('#res').innerText.replace(/\n+/g,'; ');return o}
function setCM(m){CM=m;try{localStorage.setItem('aim',m)}catch(e){}$('#ai').className=m==='wide'?'wide':m==='off'?'off':'';$('#ln').hidden=m!=='off';$('#wd').textContent=m==='wide'?'Perkecil':'Perlebar';dispatchEvent(new Event('resize'))}
function ctxUI(){const p=pg();$('#pc').textContent='Sedang melihat: '+PN[p];$('#sq').innerHTML=PQ[p].map(c=>`<button data-q="${c}">${c}</button>`).join('');document.querySelectorAll('#sq [data-q]').forEach(b=>b.onclick=()=>send(b.dataset.q))}
function mountChat(){
 if(matchMedia('(max-width:1100px)').matches)CM='off';
 $('#ai').innerHTML=`<div class="ah"><div><b>Asisten DOIntelligence</b><small id="pc"></small></div><div><button class="ib" id="wd"></button><button class="ib" id="cl">Tutup</button></div></div>
 <details class="ctxd"><summary>Data yang dibagikan</summary>${[['port','Portofolio'],['watch','Watchlist'],['alert','Alert']].map(([k,l])=>`<label class="ck"><input type="checkbox" data-c="${k}" ${CX[k]?'checked':''}>${l}</label>`).join('')}<p class="note">Halaman yang sedang dibuka selalu ikut sebagai konteks. ${AI.endpoint?'Terhubung ke backend.':'Mode simulasi: belum terhubung ke model AI, tidak ada data yang keluar dari browser.'} Jawaban bukan saran investasi.</p></details>
 <div id="log" class="log" aria-live="polite"></div><div class="sq" id="sq"></div>
 <div class="cin"><textarea id="q" rows="1" placeholder="Tanyakan tentang halaman ini atau pasar" aria-label="Pesan"></textarea><button class="pri" id="sd">Kirim</button></div>`;
 const q=$('#q'),go=()=>{const t=q.value;q.value='';q.style.height='';send(t)};
 $('#sd').onclick=go;q.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();go()}};q.oninput=()=>{q.style.height='auto';q.style.height=Math.min(q.scrollHeight,140)+'px'};
 document.querySelectorAll('[data-c]').forEach(i=>i.onchange=()=>{CX[i.dataset.c]=i.checked?1:0});
 $('#wd').onclick=()=>setCM(CM==='wide'?'open':'wide');$('#cl').onclick=()=>setCM('off');$('#ln').onclick=()=>setCM('open');
 setCM(CM);drawLog();
}

/* ---------- Router dan data live ---------- */
const R={'':dash,portofolio,watchlist:watch,grafik,alert:alerts,kelayakan:feas,sentimen:senti};
const NAV=[['','Ringkasan'],['portofolio','Portofolio'],['watchlist','Watchlist'],['grafik','Grafik'],['alert','Alert'],['kelayakan','Kelayakan'],['sentimen','Sentimen']];
function route(){const h=location.hash.slice(1),b=h.split('/')[0];(R[b]||dash)();ctxUI();
 $('#nav').innerHTML=`<div class="brand"><b>DOIntelligence</b><p class="ds2">Your AI-powered personal financial companion.</p></div>`+NAV.map(([k,l])=>`<a href="#${k}" class="${k===b?'on':''}">${l}</a>`).join('')+`<small>Copyright (c) 2026 sxpistols. All rights reserved.</small>`}
function stat(){const live=W.filter(a=>a.live).length,man=W.filter(a=>a.manual).length,dum=W.filter(a=>!a.live&&!a.manual).length;
 $('#stat').textContent=`${live} aset live · ${man} manual · ${dum} dummy · data pasar ${FEED.at?'diambil '+tgl(FEED.at):'belum tersedia'} · ${new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'})}`}
async function load(){
 $('#stat').textContent='Memuat data…';
 const [m,h,n]=await Promise.all([getJSON('market.json'),getJSON('history.json'),getJSON('news.json')]);
 applyMarket(m);
 if(h&&h.series)Object.assign(HIST,h.series);
 applyNews(n);
 try{
  const ids=W.filter(x=>x.id).map(x=>x.id);
  if(ids.length){
   const d=await get(`https://api.coingecko.com/api/v3/coins/markets?vs_currency=idr&ids=${ids.join(',')}&sparkline=true&price_change_percentage=24h`);
   d.forEach(c=>{const a=W.find(x=>x.id===c.id);if(!a)return;a.p=c.current_price;a.ch=c.price_change_percentage_24h==null?null:c.price_change_percentage_24h;
    a.spark=c.sparkline_in_7d&&c.sparkline_in_7d.price?c.sparkline_in_7d.price.filter((_,i)=>i%6===0):[];
    a.src='CoinGecko';a.srcUrl='https://www.coingecko.com/id';a.upd=c.last_updated||new Date().toISOString();a.live=1;a.manual=0});
  }
 }catch(e){FEED.err='CoinGecko tidak dapat dihubungi.'}
 try{applyFx(await get('https://api.frankfurter.dev/v1/latest?base=USD&symbols=IDR,EUR,SGD,JPY,GBP'))}catch(e){}
 applyNav();settle();stat();route();evalAlerts();
}
const eff=()=>{const t=document.documentElement.dataset.theme;return t==='dark'||(t!=='light'&&matchMedia('(prefers-color-scheme:dark)').matches)};
const thl=()=>$('#th').textContent=eff()?'Mode terang':'Mode gelap';
try{const t=localStorage.getItem('th');if(t)document.documentElement.dataset.theme=t}catch(e){}
$('#th').onclick=()=>{const t=eff()?'light':'dark';document.documentElement.dataset.theme=t;try{localStorage.setItem('th',t)}catch(e){}thl()};thl();
mountChat();addEventListener('hashchange',route);$('#reload').onclick=load;route();stat();load();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
setInterval(evalAlerts,300000);
setInterval(()=>{if(document.visibilityState==='visible'&&pageCtx().page==='Alert')alerts()},300000);
</script>

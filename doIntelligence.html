<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">

<title>DOIntelligence · Your Money. Your Markets. Your Intelligence.</title>
<style>

body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 "IBM Plex Sans","Segoe UI",system-ui,sans-serif;font-variant-numeric:tabular-nums}

.rng{display:flex;gap:4px}.rng button{padding:.25rem .7rem;font-size:.82rem;border-radius:99px}.rng button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.hd2{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.kp{display:flex;gap:28px;flex-wrap:wrap}.kp div{display:grid;gap:2px}.kp span{color:var(--mut);font-size:.82rem}.kp b{font-size:1rem}

.sp{width:110px;height:30px}

section.pn{margin-bottom:24px}
@media(max-width:640px){.hm{display:none}.pn{padding:14px;border-radius:10px}main{padding-top:16px}h1{font-size:2rem}.kp{gap:18px}}
.chat{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:24px;align-items:start}
.cl{display:flex;flex-direction:column;height:calc(100vh - 150px);min-height:460px;padding:0}
.log{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:12px}
.m{max-width:min(640px,88%);padding:10px 14px;border-radius:14px;line-height:1.55;font-size:.94rem}
.m.ai{align-self:flex-start;border:1px solid var(--line);border-bottom-left-radius:4px}
.m.me{align-self:flex-end;background:color-mix(in srgb,var(--acc) 14%,transparent);border-bottom-right-radius:4px}
.cin{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line);align-items:flex-end}
.cin textarea{flex:1;font:inherit;resize:none;max-height:140px;padding:.55rem .7rem;border:1px solid var(--line);border-radius:8px;background:var(--surf);color:var(--fg)}
.qs{display:grid;gap:8px}.qs button{text-align:left;border-radius:8px}
.ck{display:flex;gap:8px;align-items:center;color:var(--fg);font-size:.9rem;padding:3px 0}.ck input{width:auto}
.dt{display:inline-flex;gap:4px;padding:4px 0}.dt i{width:6px;height:6px;border-radius:50%;background:var(--mut);animation:bl 1s infinite}.dt i:nth-child(2){animation-delay:.15s}.dt i:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,60%,100%{opacity:.25}30%{opacity:1}}
@media(prefers-reduced-motion:reduce){.dt i{animation:none}}
@media(max-width:900px){.chat{grid-template-columns:1fr}.cl{height:72vh}}
aside{position:sticky;top:0;height:100vh;width:360px;border-left:1px solid var(--line);background:var(--surf);display:flex;flex-direction:column}
aside.wide{width:min(580px,42vw)}aside.off{display:none}
.ah{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line)}
.ah b{font-size:.98rem}.ah small{display:block;color:var(--mut);font-size:.78rem}.ah>div:last-child{display:flex;gap:6px}
.ib{padding:.3rem .6rem;font-size:.82rem}
.ctxd{padding:10px 16px;border-bottom:1px solid var(--line);font-size:.85rem}.ctxd summary{cursor:pointer;color:var(--mut)}
.sq{display:flex;gap:6px;flex-wrap:wrap;padding:10px 16px 0}.sq button{font-size:.8rem;padding:.25rem .7rem;border-radius:99px;text-align:left}

.tg{margin:4px 0 0;font-size:.78rem;color:var(--fg);line-height:1.35;font-weight:500}.ds2{margin:8px 0 0;font-size:.78rem;color:var(--mut);line-height:1.4;font-weight:400}
.mb{display:none;font-weight:650;color:var(--fg)}
@media(max-width:1100px){aside{position:fixed;right:0;top:0;bottom:0;z-index:20;width:min(100%,420px)!important;box-shadow:-8px 0 30px rgba(0,0,0,.2)}}
@media(max-width:860px){
 .app{grid-template-columns:1fr}
 nav{height:auto;position:sticky;top:0;z-index:2;flex-direction:row;overflow-x:auto;padding:10px 12px;background:var(--bg);border-right:0;border-bottom:1px solid var(--line)}
 .brand,nav small{display:none}
 .mb{display:inline}
 nav a{padding:6px 12px;border-left:0;border-bottom:2px solid transparent;white-space:nowrap}
 nav a.on{border-bottom-color:var(--acc)}
 .two,.grid3{grid-template-columns:1fr;gap:32px}
 .alo{flex-direction:column;align-items:flex-start}
}
.chip.d{border-color:var(--dn);color:var(--dn)}
.chip.man{border-color:var(--c2);color:#8a6a12}
.chip{max-width:min(360px,60vw);overflow:hidden;text-overflow:ellipsis;vertical-align:middle}
.lk{all:unset;cursor:pointer;font-weight:600;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.lk:hover{text-decoration-color:var(--acc)}.lk:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
td input{padding:.3rem .45rem;width:114px;max-width:none;text-align:right}
td input.nav{width:100%}
.nl2{list-style:none;margin:0;padding:0}
.nl2 li{padding:11px 0;border-bottom:1px solid var(--line);font-size:.9rem}
.nh{display:flex;gap:12px;justify-content:space-between;align-items:flex-start}
.nh>a{color:var(--fg);text-decoration:none;line-height:1.4}
.nh>a:hover{text-decoration:underline;text-decoration-color:var(--acc)}
.nh .chip{max-width:none}
.nm{color:var(--mut);font-size:.8rem;margin-top:5px}
.nm a{color:var(--mut)}
.chart{width:100%;display:block;height:auto}
.ctip{color:var(--mut);font-size:.85rem;min-height:1.4em;padding:4px 0 8px}
.ctip b{color:var(--fg)}
/* __CSS_MODUL_SAHAM_v1__ */
.spk-ctl{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.spk-det td{white-space:normal;text-align:left;font-size:.88rem;line-height:1.6}
.spk-verd{font-weight:600;white-space:nowrap}
.spk-mut{color:var(--mut);font-size:.82rem}
/* __CSS_MODUL_PROYEK_v1__ */
.pr-row{display:grid;grid-template-columns:2fr 1fr 1fr 1fr auto;gap:10px;align-items:end;padding:12px 0;border-bottom:1px solid var(--line)}
.pr-row:first-child{padding-top:0}
.pr-row label{display:grid;gap:4px;color:var(--mut);font-size:.84rem}
.pr-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:16px;margin-bottom:24px}
.pr-card{margin-bottom:0}
.pr-terbaik{border-color:var(--up);box-shadow:0 0 0 1px var(--up)}
.pr-best{background:color-mix(in srgb,var(--up) 10%,transparent)}
@media(max-width:640px){.pr-row{grid-template-columns:1fr 1fr}.pr-row label:first-child{grid-column:1/-1}}
</style>

<body>
<div class="app">
<nav id="nav"></nav>
<main>
<div class="top"><span class="mb">DOIntelligence</span><span id="stat"></span><div style="display:flex;gap:8px"><button id="th"></button><button id="reload">Muat ulang data</button></div></div>
<div id="view"></div>
</main>
<aside id="ai" aria-label="Asisten AI"></aside>
</div>
<button class="lnc pri" id="ln" hidden>Tanya asisten</button>
<script>
const $=s=>document.querySelector(s);
const idr=n=>'Rp'+Math.round(n).toLocaleString('id-ID');
const cmp=n=>new Intl.NumberFormat('id-ID',{notation:'compact',maximumFractionDigits:2}).format(n);
const money=x=>'Rp'+cmp(x*1e6);
const pct=n=>(n>=0?'+':'')+n.toFixed(2).replace('.',',')+'%';
const cls=n=>n>=0?'up':'dn';
const rnd=s=>()=>(s=s*16807%2147483647)/2147483647;
const walk=(seed,n,vol)=>{const r=rnd(seed),a=[1];for(let i=1;i<n;i++)a.push(a[i-1]*(1+(r()-.48)*vol));return a};
const get=async u=>{const c=new AbortController();setTimeout(()=>c.abort(),8000);const r=await fetch(u,{signal:c.signal});if(!r.ok)throw 0;return r.json()};

/* ---------- Katalog aset ----------
   `d` hanyalah harga awal (dummy) sampai data nyata masuk dari pipeline.
   Tiap aset menyimpan sumber + waktu update sendiri supaya label live/dummy
   selalu jujur. */
const CAT=[
{s:'IHSG',n:'Indeks Harga Saham Gabungan',c:'Indeks',d:7200},
{s:'BBCA',n:'Bank Central Asia',c:'Saham IDX',d:9875},
{s:'BBRI',n:'Bank Rakyat Indonesia',c:'Saham IDX',d:4120},
{s:'TLKM',n:'Telkom Indonesia',c:'Saham IDX',d:3380},
{s:'BMRI',n:'Bank Mandiri',c:'Saham IDX',d:5100},
{s:'ASII',n:'Astra International',c:'Saham IDX',d:4950},
{s:'ANTM',n:'Aneka Tambang',c:'Saham IDX',d:2580},
{s:'ICBP',n:'Indofood CBP',c:'Saham IDX',d:11250},
{s:'ADRO',n:'Adaro Energy',c:'Saham IDX',d:2400},
{s:'UNTR',n:'United Tractors',c:'Saham IDX',d:26500},
{s:'GOTO',n:'GoTo Gojek Tokopedia',c:'Saham IDX',d:65},
{s:'AAPL',n:'Apple',c:'Saham global',d:3420000},
{s:'MSFT',n:'Microsoft',c:'Saham global',d:6200000},
{s:'NVDA',n:'NVIDIA',c:'Saham global',d:2850000},
{s:'TSLA',n:'Tesla',c:'Saham global',d:3900000},
{s:'GOOGL',n:'Alphabet',c:'Saham global',d:2900000},
{s:'BTC',n:'Bitcoin',c:'Kripto',d:1.55e9,id:'bitcoin'},
{s:'ETH',n:'Ethereum',c:'Kripto',d:5.6e7,id:'ethereum'},
{s:'SOL',n:'Solana',c:'Kripto',d:3.1e6,id:'solana'},
{s:'USD/IDR',n:'Dolar AS',c:'Forex',d:16500},
{s:'EUR/IDR',n:'Euro',c:'Forex',d:18000},
{s:'SGD/IDR',n:'Dolar Singapura',c:'Forex',d:12300},
{s:'JPY/IDR',n:'Yen Jepang (per 1 yen)',c:'Forex',d:110},
{s:'GBP/IDR',n:'Pound Inggris',c:'Forex',d:21000},
{s:'EMAS',n:'Emas per gram (XAU/IDR)',c:'Emas',d:2150000},
{s:'RDPU',n:'Reksa dana pasar uang',c:'Reksa dana',d:1850},
{s:'RDPT',n:'Reksa dana pendapatan tetap',c:'Reksa dana',d:1420},
{s:'RDS',n:'Reksa dana saham',c:'Reksa dana',d:1180}
];
const W=CAT.map(a=>({...a,p:a.d,ch:0,spark:[],src:'Dummy',live:0,upd:null}));
const mk=(a,i)=>{const s=walk(i+1,30,.015),k=a.p/s[29];a.spark=s.map(x=>x*k);a.ch=(s[29]/s[28]-1)*100;a.src='Dummy'};
W.forEach(mk);

/* ---------- Penyimpanan lokal ---------- */
const store={read(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},write(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}};
const DEMO={holdings:[{s:'BBCA',q:1200,avg:9200},{s:'TLKM',q:3000,avg:3600},{s:'AAPL',q:1.5,avg:3100000},{s:'BTC',q:.012,avg:1.2e9},{s:'ETH',q:.4,avg:4.6e7},{s:'EMAS',q:20,avg:1.9e6},{s:'RDPU',q:8000,avg:1700}],tx:[],demo:true};
let PORT=store.read('di.portfolio',null)||JSON.parse(JSON.stringify(DEMO));
let H=Array.isArray(PORT.holdings)?PORT.holdings:[];
let ALR=store.read('di.alerts',null)||{rules:[{id:'a1',s:'BTC',d:'>=',t:1.6e9,armed:true},{id:'a2',s:'BBCA',d:'<=',t:9500,armed:true}],log:[],cfg:{os:true,type:'telegram',hook:'',chat:''}};
ALR.log=ALR.log||[];ALR.cfg=ALR.cfg||{os:true,type:'telegram',hook:'',chat:''};
let A=ALR.rules;
let NAVM=store.read('di.nav',{});
let CHKMSG='';
let S=[];      // berita nyata beserta skornya
let NEWS=[];   // item berita lengkap
const F={mode:'A'};
const FEED={market:null,news:null,at:null,err:''};
const HIST={}; // seri harga historis per simbol
const tgl=iso=>iso?new Date(iso).toLocaleString('id-ID',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'—';
const saveP=()=>{PORT.holdings=H;store.write('di.portfolio',PORT)};
const saveA=()=>{ALR.rules=A;store.write('di.alerts',ALR)};
const saveN=()=>store.write('di.nav',NAVM);

/* ---------- Label sumber data ---------- */
const srcOf=a=>a.manual?{k:'man',l:'Input manual'}:a.live?{k:'t',l:a.src}:{k:'d',l:'Dummy'};
const srcChip=a=>{const s=srcOf(a);return `<span class="chip ${s.k}"${a.srcUrl?` title="${a.srcUrl}"`:''}>${s.l}${a.upd?' · '+tgl(a.upd):''}</span>`};
const chg=a=>a.ch==null?'—':pct(a.ch);

/* ---------- Pipeline data (GitHub Actions -> cabang `data`) ---------- */
const DATA_RAW='https://raw.githubusercontent.com/sxpistols/dointelligence/data/';
async function getJSON(name){
 for(const u of ['data/'+name,DATA_RAW+name]){
  try{const j=await get(u+'?t='+Date.now());if(j)return j}catch(e){}
 }
 return null;
}
function applyMarket(m){
 if(!m||!Array.isArray(m.assets))return false;
 FEED.market=m;FEED.at=m.generatedAt;
 m.assets.forEach(x=>{
  if(!x||!isFinite(x.price))return;
  let a=W.find(w=>w.s===x.symbol);
  if(!a){a={s:x.symbol,n:x.name||x.symbol,c:x.cls||'Lainnya',p:x.price,ch:0,spark:[]};W.push(a)}
  a.p=x.price;a.ch=x.changePct==null?null:x.changePct;a.spark=Array.isArray(x.spark)?x.spark:[];
  a.src=x.source||'Yahoo Finance';a.srcUrl=x.sourceUrl;a.upd=x.asOf;a.live=1;a.manual=0;
  if(x.fund)a.fund=x.fund; // fundamental pipeline (PER, PBV, ROE, ...) diteruskan ke modul saham
  if(x.name)a.n=x.name;
 });
 return true;
}
function applyFx(j){

function portSeries(days){

 const out=ts.map(t=>{
  let v=0;
  use.forEach(u=>{let c=null;for(const [bt,bc] of u.m){if(bt<=t)c=bc;else break}v+=u.h.q*(c==null?u.h.avg:c)});

}

/* ---------- Indikator teknikal ---------- */
function ema(a,p){const k=2/(p+1),out=Array(a.length).fill(null);let prev=null;for(let i=0;i<a.length;i++){if(i<p-1)continue;if(prev==null){prev=a.slice(0,p).reduce((x,y)=>x+y,0)/p}else prev=a[i]*k+prev*(1-k);out[i]=prev}return out}
const sma=(a,p)=>a.map((_,i)=>i<p-1?null:a.slice(i-p+1,i+1).reduce((x,y)=>x+y,0)/p);
function rsi(a,p=14){
 const out=Array(a.length).fill(null);let ag=0,al=0;
 for(let i=1;i<a.length;i++){
  const d=a[i]-a[i-1],g=Math.max(d,0),l=Math.max(-d,0);
  if(i<=p){ag+=g;al+=l;if(i===p){ag/=p;al/=p;out[i]=al===0?100:100-100/(1+ag/al)}}
  else{ag=(ag*(p-1)+g)/p;al=(al*(p-1)+l)/p;out[i]=al===0?100:100-100/(1+ag/al)}
 }
 return out;
}
function macd(a,f=12,s=26,g=9){
 const ef=ema(a,f),es=ema(a,s),line=a.map((_,i)=>ef[i]!=null&&es[i]!=null?ef[i]-es[i]:null);
 const idx=line.map((v,i)=>v==null?null:i).filter(v=>v!=null),vals=idx.map(i=>line[i]),sg=ema(vals,g);
 const signal=Array(a.length).fill(null);idx.forEach((i,k)=>{if(sg[k]!=null)signal[i]=sg[k]});
 return {line,signal,hist:line.map((v,i)=>v!=null&&signal[i]!=null?v-signal[i]:null)};
}
function srLevels(bars){
 const c=bars.at(-1)[4],Wn=3,hi=[],lo=[];
 for(let i=Wn;i<bars.length-Wn;i++){
  let isH=true,isL=true;
  for(let j=i-Wn;j<=i+Wn;j++){if(j===i)continue;if(bars[j][2]>=bars[i][2])isH=false;if(bars[j][3]<=bars[i][3])isL=false}
  if(isH)hi.push(bars[i][2]);if(isL)lo.push(bars[i][3]);
 }

}

}

   (Yahoo Finance quoteSummary, disalurkan applyMarket dari market.json);
   (2) input manual pengguna (localStorage `di.fund`); (3) angka CONTOH generik
   yang SAMA untuk semua saham, selalu berlabel "Dummy — contoh" — tidak pernah
   disajikan sebagai data nyata. Tidak ada API fundamental gratis yang
   terverifikasi selain quoteSummary Yahoo; bila pipeline belum berhasil
   mengambilnya, isi angka manual dari laporan keuangan emiten.
   Catatan DER: Yahoo mengembalikan debtToEquity dalam satuan persen

   input manual diasumsikan sudah rasio (x). Untuk bank, Yahoo tidak memberi

/* ---------- Modul Proyek: feasibility multi-skema ----------
   Satu proyek, beberapa skema pembiayaan. Investasi awal + arus kas
   BERSAMA untuk semua skema; yang berbeda hanya struktur pembiayaan
   (bobot ekuitas, biaya utang, pajak), sehingga tiap skema punya WACC
   sendiri. Per skema dihitung NPV, IRR, payback sederhana, discounted
   payback, dan profitability index, lalu dibandingkan + diberi peringkat.
   Peringkat 1 = NPV tertinggi; tie-break IRR lebih tinggi, lalu payback
   lebih cepat. State tersimpan di localStorage kunci `di.proyek`.
   Memakai helper global npv/irr/P/money/bars (tidak ditulis ulang). */
const PR_KEY='di.proyek';
function prDefault(){return{inv:1500,cf:'400, 450, 500, 550, 600',rf:7,beta:1.1,erp:6,skema:[
 {nama:'100% Ekuitas',we:100,kd:9,tx:22},
 {nama:'70% Ekuitas / 30% Utang',we:70,kd:9,tx:22},
 {nama:'50% Ekuitas / 50% Utang',we:50,kd:9,tx:22}]}}
const prNum=(x,d)=>{const v=parseFloat(x);return isFinite(v)?v:d};
const prEsc=t=>String(t==null?'':t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function prSanitize(d){
 const def=prDefault();
 if(!d||typeof d!=='object')return def;
 const inv=prNum(d.inv,def.inv);
 const out={inv:inv>0?inv:def.inv,
  cf:typeof d.cf==='string'&&d.cf.trim()?d.cf:def.cf,
  rf:prNum(d.rf,def.rf),beta:prNum(d.beta,def.beta),erp:prNum(d.erp,def.erp),
  skema:Array.isArray(d.skema)?d.skema.slice(0,4).map((s,i)=>({nama:s&&typeof s.nama==='string'&&s.nama.trim()?s.nama.slice(0,60):'Skema '+(i+1),
   we:Math.min(100,Math.max(0,prNum(s&&s.we,50))),
   kd:Math.max(0,prNum(s&&s.kd,9)),
   tx:Math.min(100,Math.max(0,prNum(s&&s.tx,22)))})):def.skema};
 if(!out.skema.length)out.skema=def.skema;
 return out;
}
let PR=prSanitize(store.read(PR_KEY,null));
const prSave=()=>store.write(PR_KEY,PR);
const prKe=()=>PR.rf+PR.beta*PR.erp; // biaya ekuitas CAPM, dalam %
function prWacc(s){const ke=prKe()/100,we=Math.min(100,Math.max(0,s.we))/100;
 return we*ke+(1-we)*(s.kd/100)*(1-s.tx/100)} // fraksi per tahun
function prFlows(){return PR.cf.split(',').map(x=>parseFloat(x)).filter(x=>isFinite(x))}
function prHitung(s){
 const inv=PR.inv,cf=prFlows(),fl=[-inv,...cf],w=prWacc(s);
 const N=npv(w,fl),R=irr(fl),pi=inv>0?(N+inv)/inv:null;
 let cum=-inv,pb=null;
 for(let i=1;i<fl.length;i++){if(cum+fl[i]>=0){pb=i-1+(-cum)/fl[i];break}cum+=fl[i]}
 let dcum=-inv,dpb=null;const dc=[-inv];
 for(let i=1;i<fl.length;i++){const d=fl[i]/Math.pow(1+w,i);dc.push(dcum+d);
  if(dpb==null&&d>0&&dcum+d>=0)dpb=i-1+(-dcum)/d;dcum+=d}
 return{w,N,R,pb,dpb,pi,fl,dc};
}
function prPeringkat(hs){
 return hs.map((_,i)=>i).sort((a,b)=>{const A=hs[a].h,B=hs[b].h;
  if(B.N!==A.N)return B.N-A.N;
  const ra=A.R==null?-Infinity:A.R,rb=B.R==null?-Infinity:B.R;
  if(rb!==ra)return rb-ra;
  const pa=A.pb==null?Infinity:A.pb,pb=B.pb==null?Infinity:B.pb;
  return pa-pb});
}
const prFmtY=v=>v==null?'Belum kembali':v.toFixed(1).replace('.',',')+' tahun';
const prLayak=h=>h.N>0&&h.R!=null&&h.R>h.w;
function prRenderSkema(){
 const el=$('#pr-skema');if(!el)return;
 el.innerHTML=PR.skema.map((s,i)=>`<div class="pr-row">
  <label>Nama skema<input id="pr-skema-${i}-nama" value="${prEsc(s.nama)}"></label>
  <label>Bobot ekuitas (%)<input id="pr-skema-${i}-we" type="number" step="any" min="0" max="100" value="${s.we}"></label>
  <label>Biaya utang / kd (%)<input id="pr-skema-${i}-kd" type="number" step="any" min="0" value="${s.kd}"></label>
  <label>Pajak (%)<input id="pr-skema-${i}-tx" type="number" step="any" min="0" value="${s.tx}"></label>
  <button data-pr-del="${i}" ${PR.skema.length<=1?'disabled':''}>Hapus</button></div>`).join('');
 PR.skema.forEach((s,i)=>{
  $('#pr-skema-'+i+'-nama').oninput=e=>{s.nama=e.target.value;prSave();prRender()};
  [['we','pr-skema-'+i+'-we'],['kd','pr-skema-'+i+'-kd'],['tx','pr-skema-'+i+'-tx']].forEach(([k,id])=>{
   $('#'+id).oninput=e=>{s[k]=prNum(e.target.value,s[k]);prSave();prRender()}});
 });
 el.querySelectorAll('[data-pr-del]').forEach(b=>b.onclick=()=>{PR.skema.splice(+b.dataset.prDel,1);prSave();prRenderSkema();prRender()});
 const tb=$('#pr-tambah');if(tb)tb.disabled=PR.skema.length>=4;
}
function prRender(){
 const el=$('#pr-hasil');if(!el)return;
 const keEl=$('#pr-ke');if(keEl)keEl.textContent=P(prKe()/100);
 const inv=PR.inv,cf=prFlows();
 if(!(inv>0)||!cf.length){
  el.innerHTML=`<div class="pn"><b>Isi investasi awal dan arus kas dulu.</b><p class="note" style="margin:6px 0 0">Investasi awal harus lebih dari nol dan arus kas per tahun diisi minimal satu tahun (angka dipisah koma, dalam Rp juta).</p></div>`;return}
 const hs=PR.skema.map(s=>({s,h:prHitung(s)}));
 const order=prPeringkat(hs),rankOf={};order.forEach((idx,r)=>rankOf[idx]=r+1);
 const best=hs[order[0]],bh=best.h;
 const wMin=Math.min(...hs.map(x=>x.h.w));
 const pbVals=hs.map(x=>x.h.pb).filter(v=>v!=null),pbMin=pbVals.length?Math.min(...pbVals):null;
 const kdAT=best.s.kd*(1-best.s.tx/100);
 let why=`<b>${prEsc(best.s.nama)}</b> menempati peringkat 1 karena NPV-nya tertinggi, <b>${money(bh.N)}</b>. `;
 why+=`WACC-nya ${P(bh.w)}${bh.w===wMin?' — terendah di antara semua skema, sehingga arus kas masa depan didiskonto paling ringan':''}. `;
 if(best.s.we<100&&kdAT<prKe())why+=`Skema ini memakai utang ${100-best.s.we}% dengan biaya setelah pajak ${kdAT.toFixed(2).replace('.',',')}%, lebih murah dari biaya ekuitas ${P(prKe()/100)}, sehingga WACC turun. `;
 why+=bh.R!=null?`IRR ${P(bh.R)} berada di atas WACC ${P(bh.w)}, dan payback ${prFmtY(bh.pb)}${bh.pb!=null&&bh.pb===pbMin?' (tercepat)':''}.`:'IRR tidak terhitung karena arus kas tidak berganti tanda.';
 const cards=hs.map((x,i)=>{const isBest=i===order[0],h=x.h;
  return `<section class="pn pr-card${isBest?' pr-terbaik':''}"><h2>${prEsc(x.s.nama)} ${isBest?'★':''}</h2>
  <p style="margin:-6px 0 12px"><span class="chip ${isBest?'t':''}">Peringkat #${rankOf[i]}${isBest?' · Terbaik':''}</span></p>
  <dl><div><dt>WACC</dt><dd>${P(h.w)}</dd></div>
  <div><dt>NPV</dt><dd class="${cls(h.N)}">${money(h.N)}</dd></div>

  <div><dt>Payback sederhana</dt><dd>${prFmtY(h.pb)}</dd></div>
  <div><dt>Discounted payback</dt><dd>${prFmtY(h.dpb)}</dd></div>
  <div><dt>Profitability index</dt><dd>${h.pi==null?'—':h.pi.toFixed(2).replace('.',',')}</dd></div></dl>
  <p class="note">${h.R==null?'IRR tidak ditemukan: arus kas tidak berganti tanda. ':''}${prLayak(h)?'Layak menurut NPV dan IRR pada asumsi ini.':'Belum layak menurut NPV atau IRR pada asumsi ini.'}</p></section>`}).join('');
 const row=(l,f)=>`<tr><td>${l}</td>${hs.map((x,i)=>`<td class="${i===order[0]?'pr-best':''}">${f(x.h)}</td>`).join('')}</tr>`;
 const d=[-.02,-.01,0,.01,.02],m=[.8,.9,1,1.1,1.2];
 const sens=`<div class="pn sc"><h2>Sensitivitas NPV — skema terbaik (${prEsc(best.s.nama)})</h2><table><tr><th>Diskonto \\ arus kas</th>${m.map(x=>`<th>${Math.round(x*100)}%</th>`).join('')}</tr>${d.map(y=>`<tr><td>${P(bh.w+y)}</td>${m.map(x=>{const z=npv(bh.w+y,[bh.fl[0],...bh.fl.slice(1).map(q=>q*x)]);return `<td class="${z>=0?'hu':'hd'}">${money(z)}</td>`}).join('')}</tr>`).join('')}</table>
 <p class="note">Baris = tingkat diskonto di sekitar WACC skema terbaik (${P(bh.w)} ± 2pp); kolom = arus kas tahunan diskalakan 80–120%.</p></div>`;
 el.innerHTML=`<div class="pr-grid">${cards}</div>
 <div class="pn sc"><h2>Perbandingan skema</h2><table><tr><th>Ukuran</th>${hs.map((x,i)=>`<th class="${i===order[0]?'pr-best':''}">${prEsc(x.s.nama)}${i===order[0]?' ★':''}</th>`).join('')}</tr>
 ${row('WACC',h=>P(h.w))}${row('NPV',h=>money(h.N))}${row('IRR',h=>h.R==null?'—':P(h.R))}
 ${row('Payback sederhana',h=>prFmtY(h.pb))}${row('Discounted payback',h=>prFmtY(h.dpb))}
 ${row('Profitability index',h=>h.pi==null?'—':h.pi.toFixed(2).replace('.',','))}
 ${row('Peringkat',h=>'#'+rankOf[hs.findIndex(x=>x.h===h)])}</table></div>
 <div class="pn"><h2>Kenapa skema terbaik menang?</h2><p style="margin:0">${why}</p></div>
 <div class="pn"><h2>Arus kas kumulatif terdiskonto — skema terbaik (${prEsc(best.s.nama)})</h2>${bars(bh.dc)}<p class="note">Tahun 0 sampai ${bh.fl.length-1}, didiskonto dengan WACC skema terbaik (${P(bh.w)}). Batang melewati nol pada tahun discounted payback.</p></div>
 ${sens}
 <p class="note">Semua angka dalam Rp juta (investasi awal dan arus kas diinput dalam Rp juta). Hasil bergantung pada asumsi dan bukan saran investasi.</p>`;
}

/* Untuk memakai model AI sungguhan: isi endpoint dengan alamat backend Anda (mis. '/api/chat').
   API key HARUS disimpan di backend, jangan pernah di file ini. Backend menerima {messages, context} dan mengembalikan {reply}. */
const AI={endpoint:'',async ask(m,c){if(!AI.endpoint)return mock(m.at(-1).content,c);const r=await fetch(AI.endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:m,context:c})});if(!r.ok)throw 0;return(await r.json()).reply}};
const CH=[{r:'ai',t:'Halo, saya asisten DOIntelligence. Saya ikut melihat halaman yang sedang Anda buka, jadi Anda bisa bertanya seperti "jelaskan hasil di layar". Jawaban saya masih simulasi berbasis aturan, dihitung dari data yang sedang tampil di halaman ini.'}];
const CX={port:1,watch:1,alert:1};let busy=false;
const esc=t=>t.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=t=>esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\n/g,'<br>');
const pf=()=>{const rows=H.map(h=>({h,a:W.find(x=>x.s===h.s)})).filter(x=>x.a).map(({h,a})=>{const v=h.q*a.p,c=h.q*h.avg;return{s:h.s,c:a.c,v,pl:v-c,pp:(v-c)/(c||1)*100}}),tot=rows.reduce((a,r)=>a+r.v,0),cost=rows.reduce((a,r)=>a+r.v-r.pl,0);return{rows,tot,pl:tot-cost,pp:(tot-cost)/(cost||1)*100}};
const ctx=()=>({page:pageCtx(),portfolio:CX.port?pf().rows:undefined,watchlist:CX.watch?W.map(a=>({s:a.s,p:a.p,ch:a.ch,src:a.src})):undefined,alerts:CX.alert?A:undefined});
function mock(q,c){q=q.toLowerCase();
 if(/sumber data/.test(q))return 'Saham IDX, saham global, IHSG, emas, dan forex diambil pipeline Yahoo Finance yang berjalan terjadwal di GitHub Actions; kurs acuan dari ECB lewat Frankfurter. Kripto dari CoinGecko langsung di peramban. NAV reksa dana diisi manual karena tidak ada feed gratisnya. Harga Yahoo tertunda, bukan real-time bursa. Tiap aset menampilkan sumber dan waktu update di kolom Sumber.';
 if(/cara kerja alert/.test(q))return 'Anda menentukan aset, arah (naik hingga atau turun hingga), dan harga target. Alert disimpan di localStorage dan diperiksa saat halaman dibuka serta tiap 5 menit selama terbuka. Saat kondisi terpenuhi, notifikasi sistem dikirim dan/atau webhook Anda dipanggil (mis. bot Telegram); hasilnya tercatat di riwayat alert. Alert tidak pernah dinilai dari data dummy.';
 if(/di layar|halaman ini|yang saya lihat/.test(q)){const g=c.page;if(g.page==='Kelayakan')return 'Hasil yang tampil saat ini: '+(g.hasil||'belum ada')+'.\nNPV positif dan IRR di atas WACC menandakan layak pada asumsi ini. Coba ubah asumsi lalu tanyakan lagi.';if(g.page==='Ringkasan')return `Anda sedang melihat ringkasan portofolio dengan rentang ${g.range}`+(g.disembunyikan.length?`, kelas aset disembunyikan: ${g.disembunyikan.join(', ')}.`:'.');if(g.page==='Watchlist')return `Anda sedang melihat watchlist (filter: ${g.filter}).`;return `Anda sedang berada di halaman ${g.page}.`}
 if(/naik paling|tertinggi|paling tinggi/.test(q)){if(!c.watchlist)return 'Data watchlist tidak dibagikan ke saya. Aktifkan di panel "Data yang dibagikan".';const r=[...W].sort((a,b)=>b.ch-a.ch);return `Kenaikan 24 jam tertinggi: **${r[0].s}** (${pct(r[0].ch)}), lalu **${r[1].s}** (${pct(r[1].ch)}).`}
 const off=k=>`Data ${k} tidak dibagikan ke saya. Aktifkan di panel "Data yang dibagikan" agar saya bisa menjawab.`,sym=W.find(a=>q.includes(a.s.toLowerCase()));
 if(/alert/.test(q)){if(!c.alerts)return off('alert');const t=A.filter(a=>{const p=W.find(x=>x.s===a.s).p;return a.d==='>='?p>=a.t:p<=a.t});return `Ada **${A.length}** alert aktif dan **${t.length}** terpicu.`+(t.length?'\nTerpicu: '+t.map(a=>a.s).join(', ')+'.':'\nBelum ada yang mencapai target.')}
 if(/npv|irr|wacc|layak|dcf/.test(q))return '**NPV** adalah selisih nilai kini arus kas masa depan dengan investasi awal. NPV positif berarti proyek menambah nilai.\n**IRR** adalah tingkat imbal hasil yang membuat NPV sama dengan nol. Proyek layak jika IRR di atas biaya modal.\n**WACC** adalah rata-rata biaya modal dari ekuitas dan utang, dan dipakai sebagai tingkat diskonto.\nCoba ubah asumsi di halaman Kelayakan dan lihat tabel sensitivitasnya. Hasilnya bergantung pada asumsi dan bukan saran investasi.';
 if(/sentimen|berita/.test(q)){const by={};S.forEach(x=>(by[x.s]=by[x.s]||[]).push(x.v));return 'Skor sentimen rata-rata dari berita nyata (skala −1 sampai +1):\n'+Object.entries(by).map(([k,a])=>`• **${k}**: ${(a.reduce((x,y)=>x+y,0)/a.length).toFixed(2).replace('.',',')}`).join('\n')}
 if(!c.portfolio&&/portofolio|alokasi|terbaik|terlemah|untung|rugi|ringkas|total/.test(q))return off('portofolio');
 const P=pf();
 if(/alokasi|komposisi/.test(q)){const by={};P.rows.forEach(r=>by[r.c]=(by[r.c]||0)+r.v);return 'Alokasi aset Anda:\n'+Object.entries(by).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`• **${k}**: ${(v/P.tot*100).toFixed(1).replace('.',',')}%`).join('\n')}
 if(/terbaik|terlemah|untung|rugi|kinerja/.test(q)){const r=[...P.rows].sort((a,b)=>b.pp-a.pp);return `Terbaik: **${r[0].s}** (${pct(r[0].pp)}). Terlemah: **${r.at(-1).s}** (${pct(r.at(-1).pp)}).\nPosisi rugi: ${r.filter(x=>x.pl<0).map(x=>x.s).join(', ')||'tidak ada'}.`}
 if(sym){if(!c.watchlist)return off('watchlist');return `**${sym.s}** (${sym.n}) ${idr(sym.p)}, ${pct(sym.ch)} dalam 24 jam. Sumber data: ${sym.src}.`}
 if(/portofolio|ringkas|nilai|total/.test(q))return `Nilai portofolio **${idr(P.tot)}** dengan hasil **${pct(P.pp)}** (${idr(P.pl)}) dari modal. Terdiri dari ${P.rows.length} aset di ${new Set(P.rows.map(r=>r.c)).size} kelas aset.`;
 return 'Saya belum paham pertanyaan itu. Coba tanyakan tentang ringkasan portofolio, alokasi aset, kinerja aset, alert, sentimen, harga suatu aset, atau arti NPV, IRR, dan WACC.'}
